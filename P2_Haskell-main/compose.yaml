services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --mysql-native-password=ON
      - --authentication-policy=mysql_native_password,,
      - --default-time-zone=-03:00
    environment:
      MYSQL_DATABASE: pimpinella
      MYSQL_USER: stockeasy
      MYSQL_PASSWORD: stockeasy
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Sao_Paulo
    volumes:
      - ./.mysql-data:/var/lib/mysql
      - ./database/stockeasy.sql:/docker-entrypoint-initdb.d/01-stockeasy.sql:ro
      - ./database/massa_teste.sql:/docker-entrypoint-initdb.d/02-massa-teste.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      retries: 30

  backend:
    build: ./backend
    environment:
      DB_HOST: mysql
      DB_PASSWORD: stockeasy
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      API_URL: http://backend:8080
      TZ: America/Sao_Paulo
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
